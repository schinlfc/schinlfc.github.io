<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440" width="340" height="440" role="img" aria-label="The Longer Reach of Lead — Economics and Human Biology, forthcoming">
  <rect width="340" height="440" fill="#660000"/>
  <rect x="14" y="14" width="312" height="412" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">
    <text x="30" y="80" font-size="26" font-weight="700">
      <tspan x="30" dy="0">The Longer Reach</tspan>
      <tspan x="30" dy="32">of Lead</tspan>
    </text>
    <text x="30" y="150" font-size="14" font-style="italic" fill="rgba(255,255,255,0.85)">
      <tspan x="30" dy="0">Early Childhood Lead Exposure</tspan>
      <tspan x="30" dy="20">and Cognitive Ability</tspan>
      <tspan x="30" dy="20">Later-in-Life</tspan>
    </text>
    <text x="30" y="250" font-size="13" font-family="'Roboto', Arial, sans-serif" fill="rgba(255,255,255,0.75)">
