      <tspan x="30" dy="18">and David Mushinski</tspan>
    </text>
  </g>
  <rect x="0" y="370" width="340" height="70" fill="rgba(0,0,0,0.28)"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">
    <text x="30" y="398" font-size="15" font-style="italic">Economics and Human Biology</text>
    <text x="30" y="420" font-size="13" fill="rgba(255,255,255,0.7)">Forthcoming</text>
  </g>
</svg>
